<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reise-Protokoll</title></head><body><style>
:root { color-scheme: light; --ui: #1f6f8b; --ui-d: #175a72; --bg: #f3f5f7; --card: #fff; --line: #dde3e8; --txt: #1d2a33; --mut: #6b7a86; --warn: #b45309; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--txt); background: var(--bg); }
[hidden] { display: none !important; }
#app { height: 100vh; display: flex; flex-direction: column; }
.grow { flex: 1; }

/* Kopfleiste */
.top { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; color: var(--ui); }
.ver { font-weight: 400; font-size: 12px; color: var(--mut); }
button, select, input, textarea { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
button:hover { border-color: var(--ui); }
button.primary { background: var(--ui); border-color: var(--ui); color: #fff; font-weight: 600; }
button.primary:hover { background: var(--ui-d); }
button:disabled { opacity: .55; cursor: wait; }
button.ghost { border-color: transparent; background: transparent; color: var(--ui); padding: 4px 8px; }
button.ico { padding: 2px 8px; line-height: 1.2; }
select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--card); }

main { flex: 1; display: flex; min-height: 0; }

/* Seitenleiste */
#side { width: 440px; flex: none; display: flex; flex-direction: column; background: var(--card); border-right: 1px solid var(--line); }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; padding: 10px 6px; background: none; color: var(--mut); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--ui); border-bottom-color: var(--ui); font-weight: 600; }
#panel { flex: 1; overflow: auto; padding: 14px; }
#panel h3 { margin: 18px 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--mut); }
#panel h3:first-child { margin-top: 0; }

.f { display: block; margin: 0 0 10px; }
.f > span { display: block; font-size: 12px; color: var(--mut); margin-bottom: 3px; }
.f input, .f textarea, .f select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; background: #fff; }
.f textarea { resize: vertical; }
.f input:focus, .f textarea:focus, .f select:focus { outline: 2px solid color-mix(in srgb, var(--ui) 35%, transparent); border-color: var(--ui); }
.row { display: flex; gap: 6px; align-items: center; }
.row > * { min-width: 0; }
.row.two > .f { flex: 1; }
.wx { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 6px; }
.chk { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
small { color: var(--mut); font-size: 12px; }
.geo.ok { color: #2f6b4f; }
.res { display: grid; gap: 2px; margin-top: 4px; }
.res button { text-align: left; font-size: 12px; padding: 5px 8px; }

.tpls { display: grid; gap: 8px; }
.tpl { text-align: left; padding: 10px 12px; border-radius: 10px; }
.tpl b { display: block; }
.tpl small { display: block; }
.tpl.on { border-color: var(--ui); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ui) 25%, transparent); }
.themes { display: flex; gap: 8px; flex-wrap: wrap; }
.theme { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 5px; border-radius: 999px; }
.theme i { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
.theme.on { border-color: var(--ui); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ui) 25%, transparent); }

/* Tage */
details.day { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 8px; background: #fff; }
details.day > summary { cursor: pointer; padding: 9px 12px; font-weight: 600; list-style: none; display: flex; gap: 8px; align-items: center; }
details.day > summary::before { content: "▸"; color: var(--mut); }
details.day[open] > summary::before { content: "▾"; }
details.day .body { padding: 4px 12px 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.dsum { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dsum small { font-weight: 400; margin-left: 4px; }
.cost { display: grid; grid-template-columns: 1fr 108px 70px 28px; gap: 4px; margin-bottom: 4px; }
.cost input, .cost select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-width: 0; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.thumb { position: relative; width: 62px; height: 62px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 1px; right: 1px; padding: 0 5px; line-height: 1.2; border-radius: 4px; background: rgba(255,255,255,.9); }
.drop { display: block; border: 2px dashed var(--line); border-radius: 10px; padding: 12px; text-align: center; color: var(--mut); cursor: pointer; margin-bottom: 10px; }
.drop.over, .drop:hover { border-color: var(--ui); color: var(--ui); }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }

/* Karte */
.pt { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: start; margin-bottom: 6px; }
.pt .n { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ui); color: #fff; font-size: 12px; margin-top: 4px; }
.pt .f { margin: 0; }
.mapimg { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; margin-top: 8px; }
.note { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; border-radius: 8px; padding: 6px 10px; margin: 8px 0; font-size: 12px; }
.stat { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--line); }

/* Vorschau */
#view { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.viewbar { display: flex; align-items: center; gap: 14px; padding: 8px 16px; font-size: 13px; color: var(--mut); border-bottom: 1px solid var(--line); background: var(--card); }
#warn { color: var(--warn); }
#pages { flex: 1; overflow: auto; padding: 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.sheet { position: relative; width: calc(min(720px, 100%) * var(--z, 1)); flex: none; background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,.18); container-type: inline-size; overflow: hidden; }
.ab { position: absolute; }
.t { line-height: 1; white-space: pre; }
.im { object-fit: cover; display: block; }
svg.ab { overflow: visible; }

#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #1d2a33; color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 10; max-width: 80vw; }

@media (max-width: 900px) {
  main { flex-direction: column; }
  #side { width: auto; max-height: 55vh; border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>

<div id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6.5-5.7 6.5-11a6.5 6.5 0 1 0-13 0C5.5 15.3 12 21 12 21z"/><circle cx="12" cy="10" r="2.4"/></svg> Reise-Protokoll <span class="ver">v0.2.0</span></div>
    <div class="grow"></div>
    <select id="demo" title="Beispielreise laden">

    <button class="primary" data-act="pdf" id="pdfBtn">PDF erstellen</button>

  </header>
  <main>
    <aside id="side">

        <span id="pageCount"></span>

        <label>Zoom <select id="zoom"><option value="55">55 %</option><option value="75">75 %</option><option value="100" selected>100 %</option><option value="130">130 %</option></select></label>
      </div>
      <div id="pages"></div>
    </section>
  </main>
</div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
/* ===== 00-util.js ===== */
"use strict";

/* ---------- Kleine Helfer ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ---------- Datum (immer als ISO-Text JJJJ-MM-TT, Rechnen in UTC) ---------- */
const parseIso = (s) => (/^\d{4}-\d{2}-\d{2}$/.test(s || "") ? new Date(s + "T12:00:00Z") : null);
const isoOf = (d) => d.toISOString().slice(0, 10);
const addDays = (iso, n) => isoOf(new Date(parseIso(iso).getTime() + n * 864e5));
const diffDays = (a, b) => Math.round((parseIso(b) - parseIso(a)) / 864e5);
function fmtDate(iso, opt) {
  const d = parseIso(iso);
  return d ? d.toLocaleDateString("de-DE", { timeZone: "UTC", ...opt }) : "";
}
const fmtLong = (iso) => fmtDate(iso, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
function fmtRange(a, b) {
  if (!parseIso(a)) return "";
  if (!parseIso(b) || a === b) return fmtDate(a, { day: "numeric", month: "long", year: "numeric" });
  const x = parseIso(a), y = parseIso(b);
  if (x.getUTCFullYear() !== y.getUTCFullYear()) return fmtDate(a, { day: "numeric", month: "long", year: "numeric" }) + " – " + fmtDate(b, { day: "numeric", month: "long", year: "numeric" });
  if (x.getUTCMonth() !== y.getUTCMonth()) return fmtDate(a, { day: "numeric", month: "long" }) + " – " + fmtDate(b, { day: "numeric", month: "long", year: "numeric" });
  return x.getUTCDate() + ". – " + fmtDate(b, { day: "numeric", month: "long", year: "numeric" });
}

/* ---------- Zahlen ---------- */
function parseNum(v) {
  let s = String(v ?? "").trim().replace(/\s/g, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : 0;
}
const hasNum = (v) => String(v ?? "").trim() !== "" && Number.isFinite(parseFloat(String(v).replace(",", ".")));
const fmtNum = (n, d = 0) => n.toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
const money = (n, cur) => fmtNum(n, Math.abs(n - Math.round(n)) > 0.004 ? 2 : 0) + " " + (cur || "EUR").replace("EUR", "€");
const listDe = (a) => (a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " und " + a[a.length - 1]);

/* ---------- Geo ---------- */
function haversine(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const hasGeo = (p) => p && Number.isFinite(p.lat) && Number.isFinite(p.lon);

/* ---------- Farben ---------- */
const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function mix(a, b, t) {
  const x = hexRgb(a), y = hexRgb(b);
  return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join("");
}

/* ---------- Benachrichtigung ---------- */
let toastTimer;
function toast(msg, ms = 3500) {
  const el = $("#toast");
  if (!el) return;
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.hidden = true), ms);
}

/* ---------- Dateien ---------- */
function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const safeName = (s) => (String(s || "Reise").replace(/[\\/:*?"<>|]+/g, " ").trim() || "Reise").slice(0, 80);

/* ===== 10-model.js ===== */
/* ---------- Datenmodell ----------
   Eine Reise (`trip`) besteht aus Einstellungen, Tagen, Route und Karte.
   Alles ist einfaches JSON und wird als Projektdatei gespeichert. */

const CATS = [
  { id: "unterkunft", name: "Unterkunft" },
  { id: "essen", name: "Essen & Trinken" },
  { id: "transport", name: "Transport" },
  { id: "aktivitaeten", name: "Aktivitäten" },
  { id: "sonstiges", name: "Sonstiges" },
];
const WEATHER = [
  { id: "sun", name: "Sonnig" }, { id: "partly", name: "Heiter" }, { id: "cloud", name: "Bewölkt" },
  { id: "rain", name: "Regen" }, { id: "storm", name: "Gewitter" }, { id: "snow", name: "Schnee" }, { id: "fog", name: "Nebel" },
];
const weatherName = (id) => (WEATHER.find((w) => w.id === id) || {}).name || "";

const blankPlace = () => ({ name: "", lat: null, lon: null });

function newDay(date = "") {
  return {
    id: uid(), date, place: blankPlace(), from: "", km: "", drive: "", title: "", lodging: "",
    weather: "", tmin: "", tmax: "", text: "", plan: "",
    highlights: "", costs: [], photos: [],
  };
}

function newTrip(template = "rundreise") {
  return {
    format: 1, template, theme: "meer", title: "", subtitle: "", travelers: "", currency: "EUR", start: "",
    startPlace: blankPlace(), destination: blankPlace(), roundTrip: false,
    days: [], summary: "", summaryAuto: true,
    route: { auto: true, road: true, points: [], km: null, legs: [], mapSig: "" },
    mapImg: "", mapUser: false, coverPhoto: "", ruled: true, costPage: true,
  };
}

/* Fehlende Felder ergänzen (beim Laden älterer oder fremder Dateien). */
function normalizeTrip(t) {
  const base = newTrip(TEMPLATES[t && t.template] ? t.template : "rundreise");
  const out = { ...base, ...t };
  out.startPlace = { ...blankPlace(), ...(t.startPlace || {}) };
  out.destination = { ...blankPlace(), ...(t.destination || {}) };
  out.route = { ...base.route, ...(t.route || {}) };
  if (!THEMES[out.theme]) out.theme = "meer";
  out.days = (Array.isArray(t.days) ? t.days : []).map((d) => ({
    ...newDay(), ...d, place: { ...blankPlace(), ...(d.place || {}) },
    costs: Array.isArray(d.costs) ? d.costs.map((c) => ({ id: uid(), l: "", cat: "sonstiges", a: "", ...c })) : [],
    photos: Array.isArray(d.photos) ? d.photos : [],
  }));
  return out;
}

/* ---------- Ableitungen ---------- */
const dayCosts = (d) => d.costs.reduce((s, c) => s + parseNum(c.a), 0);
const dayHighlights = (d) => String(d.highlights || "").split(/\r?\n/).map((s) => s.trim()).filter(Boolean);

function dayFrom(t, i) {
  const d = t.days[i];
  if (d.from.trim()) return d.from.trim();
  if (i > 0) return t.days[i - 1].place.name || "";
  return t.startPlace.name || "";
}
const dayPlaceName = (t, d) => (TEMPLATES[t.template].fixedPlace ? t.destination.name || d.place.name : d.place.name);

function tripStats(t) {
  const days = t.days, n = days.length;
  const dated = days.map((d) => d.date).filter((x) => parseIso(x)).sort();
  const start = dated[0] || t.start || "", end = dated[dated.length - 1] || "";
  const places = [], seen = new Set();
  const addP = (name) => {
    name = (name || "").trim();
    if (name && !seen.has(name.toLowerCase())) { seen.add(name.toLowerCase()); places.push(name); }
  };
  if (TEMPLATES[t.template].fixedPlace) addP(t.destination.name);
  else days.forEach((d) => addP(d.place.name));
  let km = days.reduce((s, d) => s + parseNum(d.km), 0), kmEst = false;
  if (!km && t.route.km) km = t.route.km;
  if (!km) {
    const pts = t.route.points.filter(hasGeo);
    for (let i = 1; i < pts.length; i++) km += haversine(pts[i - 1], pts[i]) * 1.25;
    kmEst = km > 0;
  }
  const byCat = {}; let cost = 0;
  days.forEach((d) => d.costs.forEach((c) => { const a = parseNum(c.a); cost += a; byCat[c.cat] = (byCat[c.cat] || 0) + a; }));
  const temps = days.filter((d) => hasNum(d.tmin) || hasNum(d.tmax)).map((d) => (hasNum(d.tmin) && hasNum(d.tmax) ? (parseNum(d.tmin) + parseNum(d.tmax)) / 2 : parseNum(hasNum(d.tmin) ? d.tmin : d.tmax)));
  return {
    nDays: n, nights: Math.max(0, n - 1), start, end, range: fmtRange(start, end), places, km: Math.round(km), kmEst,
    cost, byCat, perDay: n ? cost / n : 0, photos: days.reduce((s, d) => s + d.photos.length, 0),
    avgT: temps.length ? temps.reduce((a, b) => a + b, 0) / temps.length : null,
    sunDays: days.filter((d) => d.weather === "sun" || d.weather === "partly").length,
  };
}

/* ---------- Route aus Tagen und Fotos ---------- */
function routeFromDays(t) {
  const pts = [];
  const push = (p, force, day = -1) => {
    if (!p || !p.name) return;
    const last = pts[pts.length - 1];
    if (!force && last && (last.name === p.name || (hasGeo(last) && hasGeo(p) && haversine(last, p) < 1))) return;
    pts.push({ id: uid(), name: p.name, lat: hasGeo(p) ? p.lat : null, lon: hasGeo(p) ? p.lon : null, day });
  };
  push(t.startPlace);
  if (TEMPLATES[t.template].fixedPlace) push(t.destination);
  else {
    for (const [di, d] of t.days.entries()) {
      let p = d.place;
      if (p.name && !hasGeo(p)) {
        const g = d.photos.find((x) => x.gps);
        if (g) p = { name: p.name, lat: g.gps.lat, lon: g.gps.lon };
      }
      push(p, false, di);
    }
  }
  if (t.roundTrip && t.startPlace.name) push(t.startPlace, pts.length > 1 && pts[pts.length - 1].name !== t.startPlace.name);
  return pts;
}

function rebuildRoute(t) {
  if (t.route.auto) t.route.points = routeFromDays(t);
}

/* ---------- Zusammenfassung vorschlagen ---------- */
function suggestSummary(t) {
  const st = tripStats(t), out = [];
  const days = `${st.nDays} ${st.nDays === 1 ? "Tag" : "Tage"}`;
  if (!st.nDays) return "";
  if (TEMPLATES[t.template].fixedPlace) {
    const dest = t.destination.name || st.places[0] || "unser Ziel";
    out.push(`${st.nDays > 1 ? "Kurztrip" : "Ausflug"} nach ${dest}: ${days}${st.range ? " (" + st.range + ")" : ""}.`);
  } else {
    const start = t.startPlace.name || "", seq = [...new Set([start, ...st.places].filter(Boolean))];
    let route = "";
    const back = t.roundTrip && start ? " und zurück nach " + start : "";
    if (seq.length >= 3) route = ` von ${seq[0]} über ${listDe(seq.slice(1, back ? undefined : -1))}${back ? "" : " nach " + seq[seq.length - 1]}${back}`;
    else if (seq.length === 2) route = ` von ${seq[0]} nach ${seq[1]}${back}`;
    else if (seq.length === 1) route = ` in ${seq[0]}`;
    out.push(`Rundreise${route}: ${days}${st.range ? " (" + st.range + ")" : ""}.`);
    const bits = [];
    if (st.places.length) bits.push(`${st.places.length} ${st.places.length === 1 ? "Station" : "Stationen"}`);
    if (st.km) bits.push(`${st.kmEst ? "etwa " : ""}${fmtNum(st.km)} km`);
    if (bits.length) out.push("Unterwegs: " + bits.join(", ") + ".");
  }
  const hl = t.days.flatMap(dayHighlights).slice(0, 4);
  if (hl.length) out.push("Highlights: " + listDe(hl) + ".");
  if (st.cost > 0) out.push(`Gesamtkosten ${money(st.cost, t.currency)}, durchschnittlich ${money(st.perDay, t.currency)} pro Tag.`);
  if (st.avgT != null) out.push(`Wetter: durchschnittlich ${fmtNum(st.avgT)} °C${st.sunDays ? ", an " + st.sunDays + " von " + st.nDays + " Tagen sonnig bis heiter" : ""}.`);
  if (st.photos) out.push(`${st.photos} Fotos.`);
  return out.join(" ");
}

function refreshDerived(t) {
  rebuildRoute(t);
  if (t.summaryAuto) t.summary = suggestSummary(t);
}

/* ---------- Beispielreisen ---------- */
function demoTrip(kind) {
  const P = (name, lat, lon) => ({ name, lat, lon });
  const C = (l, cat, a) => ({ id: uid(), l, cat, a: String(a) });
  if (kind === "kurztrip") {
    const t = newTrip("kurztrip");
    Object.assign(t, {

/* ---------- Vorlagen nach Reiseart ----------

     desc                Beschreibung in der Auswahl
     fixedPlace          true: ein Zielort für die ganze Reise (Kurztrip)
     defaultDays         Anzahl Tage bei „Tage erzeugen“
     dayFields           Felder im Tages-Editor (siehe DAY_FIELDS in 80-ui.js)
     dayHeader(t, i)     Unterzeile unter dem Tagestitel
     sections(d)         Textabschnitte der Tagesseite: [{label, paras[]}] oder Zeitleiste [{label, kind:"timeline", items:[{time,text}]}]
     strip               optional: Streckenleiste unter dem Kopf; strip(t, i) → {from, to, mid}
     info(t, i)          bis zu drei Infokästen [{label, value, ico}]
     stats(t, st)        optional: vier Kennzahlen der Deckseite [{v, l}] (sonst Standard)  */
const TEMPLATES = {

      { v: st.cost > 0 ? money(st.cost, t.currency) : "–", l: "Kosten" },

    ],

    dayHeader: (t) => t.destination.name || "",
    sections: (d) => [
      { label: "Tagesplan", kind: "timeline", items: parsePlan(d.plan) },
      { label: "Notizen", paras: String(d.text || "").split(/\r?\n/) },
    ],
    info: (t, i) => {
      const d = t.days[i];
      return [weatherInfo(d), { label: "Unterkunft", value: d.lodging, ico: "bed" },
        { label: "Tageskosten", value: dayCosts(d) ? money(dayCosts(d), t.currency) : "", ico: "euro" }];
    },
  },

  rundreise: {
    id: "rundreise", name: "Rundreise", label: "Rundreise",
    desc: "Mehrere Tage an einem oder an verschiedenen Orten. Tagebuch mit Streckenleiste (von – nach), Kilometern und Unterkunft.",
    fixedPlace: false, defaultDays: 7, strip: true,
    dayFields: ["place", "from", "km", "drive", "title", "weather", "lodging", "text", "highlights", "costs", "photos"],
    dayHeader: (t, i) => {
      const d = t.days[i], from = dayFrom(t, i), to = d.place.name;
      if (!to) return from;
      return !from || from === to ? to : from + " – " + to;
    },
    sections: (d) => [{ label: "Tagebuch", paras: String(d.text || "").split(/\r?\n/) }],
    info: (t, i) => {
      const d = t.days[i];
      return [weatherInfo(d), { label: "Unterkunft", value: d.lodging, ico: "bed" },
        { label: "Tageskosten", value: dayCosts(d) ? money(dayCosts(d), t.currency) : "", ico: "euro" }];
    },
    /* Streckenleiste unter dem Kopf: von – nach, Kilometer, Fahrzeit */
    strip: (t, i) => {
      const d = t.days[i], bits = [];
      if (hasNum(d.km) && parseNum(d.km) > 0) bits.push(fmtNum(parseNum(d.km)) + " km");
      if (d.drive.trim()) bits.push(d.drive.trim() + " h");
      return { from: dayFrom(t, i), to: d.place.name, mid: bits.join("  ·  ") };
    },
  },
};

function weatherInfo(d) {
  const bits = [];
  if (d.weather) bits.push(weatherName(d.weather));
  const a = hasNum(d.tmin), b = hasNum(d.tmax);
  if (a && b) bits.push(`${fmtNum(parseNum(d.tmin))}–${fmtNum(parseNum(d.tmax))} °C`);
  else if (a || b) bits.push(`${fmtNum(parseNum(a ? d.tmin : d.tmax))} °C`);
  return { label: "Wetter", value: bits.join(" · "), ico: d.weather || "sun" };
}

/* Tagesplan: jede Zeile ein Punkt, optional mit Uhrzeit vorn („9:30 Frühstück“, „14.00 – Museum“). */
function parsePlan(text) {
  return String(text || "").split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((l) => {
    const m = /^(\d{1,2})[:.](\d{2})(?:\s*(?:Uhr|h))?\s*[-–:]?\s*(.*)$/.exec(l);
    return m ? { time: `${m[1].padStart(2, "0")}:${m[2]}`, text: m[3] || "" } : { time: "", text: l };
  });
}

/* ===== 35-text.js ===== */
/* ---------- Schriften und Textmessung (identisch für Vorschau und PDF) ----------
   Das Layout misst Texte mit den Metriken der PDF-Standardschriften. Deshalb
   brechen Vorschau und PDF an denselben Stellen um. */
const FONT_NAMES = {
  R: "Helvetica", B: "HelveticaBold", I: "HelveticaOblique", BI: "HelveticaBoldOblique",
  S: "TimesRoman", SB: "TimesRomanBold", SI: "TimesRomanItalic",
};
const isSerif = (f) => f[0] === "S";
const BASELINE = { sans: 0.8465, serif: 0.8375 }; // Grundlinie unter der Oberkante bei line-height 1
const FM = { ready: false };

async function initFonts() {
  if (!window.PDFLib) return;
  try {
    const d = await PDFLib.PDFDocument.create();
    for (const k in FONT_NAMES) FM[k] = await d.embedFont(PDFLib.StandardFonts[FONT_NAMES[k]]);
    FM.charset = new Set(FM.R.getCharacterSet());
    FM.ready = true;
  } catch (e) { console.warn(e); }
}

const SUBST = { "→": "–", "←": "–", "≈": "~", "≤": "<=", "≥": ">=", "✓": "x", "ł": "l", "Ł": "L", "đ": "d", "Đ": "D", "ı": "i", " ": " ", " ": " ", "\t": " " };
function clean(s) {
  s = String(s ?? "");
  if (!FM.ready) return s;
  return [...s].map((ch) => {
    if (FM.charset.has(ch.codePointAt(0))) return ch;
    if (SUBST[ch]) return SUBST[ch];
    const base = ch.normalize("NFD").replace(/[̀-ͯ]/g, "");
    return [...base].every((c) => FM.charset.has(c.codePointAt(0))) ? base : "?";
  }).join("");
}

function tw(s, f, size, ls = 0) {
  s = String(s);
  const w = FM.ready ? FM[f].widthOfTextAtSize(s, size) : s.length * size * 0.52;
  return w + ls * [...s].length;
}

function fitT(s, f, size, maxW, ls = 0) {
  s = clean(s);
  if (tw(s, f, size, ls) <= maxW) return s;
  while (s.length > 1 && tw(s + "…", f, size, ls) > maxW) s = s.slice(0, -1);
  return s.trimEnd() + "…";
}

function breakWord(w, f, size, maxW) {
  const parts = []; let cur = "";
  for (const ch of w) {
    if (cur && tw(cur + ch, f, size) > maxW) { parts.push(cur); cur = ch; } else cur += ch;
  }
  if (cur) parts.push(cur);
  return parts;
}

/* Bricht Text in Zeilen; jede Zeile des Eingabetextes ist ein Absatz (leere Zeile = Leerzeile). */
function wrapAll(text, f, size, maxW) {
  const out = [];
  for (const para of String(text ?? "").split(/\r?\n/)) {
    const words = clean(para).split(/\s+/).filter(Boolean);
    if (!words.length) { out.push(""); continue; }
    let cur = "";
    for (const w of words) {
      const parts = tw(w, f, size) > maxW ? breakWord(w, f, size, maxW) : [w];
      for (const part of parts) {
        const t = cur ? cur + " " + part : part;
        if (!cur || tw(t, f, size) <= maxW) cur = t; else { out.push(cur); cur = part; }
      }
    }
    out.push(cur);
  }
  return out;
}

/* Wie wrapAll, aber höchstens `maxLines` Zeilen; die letzte endet bei Bedarf mit „…“. */
function wrapMax(text, f, size, maxW, maxLines) {
  const lines = wrapAll(text, f, size, maxW);
  if (lines.length <= maxLines) return { lines, cut: false };
  const keep = lines.slice(0, maxLines);
  keep[maxLines - 1] = fitT(keep[maxLines - 1] + " …", f, size, maxW);
  return { lines: keep, cut: true };
}

/* ===== 40-layout.js ===== */
/* ---------- Seitenmodell ----------
   Aus der Reise entsteht eine Liste von Seiten {W, H, ops}. Maße in Punkt
   (1/72 Zoll), Ursprung oben links. Vorschau (pageHtml) und PDF (buildPdf)
   zeichnen beide nur aus diesem Modell – es gibt keine zweite Layout-Logik.

   Operationen (k):
     rect  {x,y,w,h,fill,stroke,sw,r}          Rechteck, optional abgerundet
     line  {x1,y1,x2,y2,c,sw}                  Linie
     t     {x,y,text,s,f,c,a,ls}               Text; y = Oberkante, a = l|c|r, ls = Buchstabenabstand
     path  {x,y,w,h,vw,vh,d,fill,stroke,sw}    SVG-Pfad im Raster vw×vh (Symbole)
     img   {x,y,w,h,src,iw,ih}                 Bild, füllt den Rahmen (zugeschnitten)         */
const PW = 595.28, PH = 841.89, MX = 40, CW = PW - 2 * MX, BOTTOM = 790;

class Pg {
  constructor(T) {
    this.W = PW; this.H = PH; this.ops = []; this.T = T;
    if (T.paper.toUpperCase() !== "#FFFFFF") this.rect(0, 0, PW, PH, { fill: T.paper });
  }
  rect(x, y, w, h, o = {}) { this.ops.push({ k: "rect", x, y, w, h, fill: o.fill || null, stroke: o.stroke || null, sw: o.sw || 0.6, r: Math.min(o.r || 0, w / 2, h / 2) }); }
  line(x1, y1, x2, y2, c, sw = 0.6) { this.ops.push({ k: "line", x1, y1, x2, y2, c, sw }); }
  text(x, y, text, o = {}) {
    this.ops.push({ k: "t", x, y, text: clean(text), s: o.s || 10, f: o.f || "R", c: o.c || this.T.ink, a: o.a || "l", ls: o.ls || 0 });
  }
  icon(name, x, y, s, c, sw = 1.6) { this.ops.push({ k: "path", x, y, w: s, h: s, vw: 24, vh: 24, d: ICONS[name] || ICONS.sun, fill: null, stroke: c, sw }); }
  img(x, y, w, h, src, iw, ih) { this.ops.push({ k: "img", x, y, w, h, src, iw: iw || w, ih: ih || h }); }
  label(x, y, text, c, a) { this.text(x, y, String(text).toUpperCase(), { f: "B", s: 7.5, c: c || this.T.accent, ls: 1.4, a }); }
}

/* ---------- Text in Spalten fließen lassen ---------- */
/* blocks: [{label, paras[]}]. Liefert die neue y-Position und die Blöcke, die nicht mehr passten. */
function flow(pg, blocks, x, y, w, yMax, o) {
  const { T, ruled } = o, lh = 16, s = 11, multi = blocks.length > 1;
  const hasText = (b) => (b.items ? b.items.length > 0 : b.paras.some((p) => p.trim()));
  const rule = (yy) => pg.line(x, yy + lh - 2, x + w, yy + lh - 2, T.rule, 0.5);
  for (let bi = 0; bi < blocks.length; bi++) {
    const b = blocks[bi], has = hasText(b);
    if (!has && !ruled) continue;
    if (y + 16 + lh * 2 > yMax) return { y, rest: blocks.slice(bi).filter(hasText) };
    pg.label(x, y, b.label + (b.cont ? " · Fortsetzung" : ""));
    y += 16;
    if (!has) {
      const n = multi ? 4 : Math.floor((yMax - y) / lh);
      for (let k = 0; k < n && y + lh <= yMax; k++) { rule(y); y += lh; }
      y += 8; continue;
    }
    if (b.items) {
      /* Zeitleiste: Uhrzeit links, senkrechte Linie mit Punkten, Text rechts */
      const tx = x + 62, tws = w - 62, top0 = y, at = pg.ops.length;
      const vline = (y2) => pg.ops.splice(at, 0, { k: "line", x1: x + 50, y1: top0 + lh / 2, x2: x + 50, y2, c: T.accent2, sw: 1.2 });
      for (let ii = 0; ii < b.items.length; ii++) {
        const it = b.items[ii], lines = wrapAll(it.text || " ", "S", s, tws), need = lines.length * lh + 6;
        if (y + need > yMax) {
          vline(y - 6 - lh / 2);
          return { y, rest: [{ label: b.label, kind: "timeline", items: b.items.slice(ii), cont: true }, ...blocks.slice(bi + 1).filter(hasText)] };
        }
        if (it.time) pg.text(x, y + (lh - 9.5) / 2, it.time, { f: "B", s: 9.5, c: T.accent });
        pg.rect(x + 47.5, y + lh / 2 - 2.5, 5, 5, { fill: it.time ? T.accent : T.accent2, r: 2.5 });
        lines.forEach((l, k) => pg.text(tx, y + k * lh + (lh - s) / 2, l, { f: "S", s }));
        y += need;
      }
      vline(y - 6 - lh / 2);
      y += 6; continue;
    }
    for (let pi = 0; pi < b.paras.length; pi++) {
      const para = b.paras[pi];
      if (!para.trim()) { y += lh * 0.5; continue; }
      const lines = wrapAll(para, "S", s, w), avail = Math.floor((yMax - y) / lh);
      const draw = (arr) => arr.forEach((l, k) => pg.text(x, y + k * lh + (lh - s) / 2, l, { f: "S", s }));
      if (lines.length <= avail) { draw(lines); y += lines.length * lh; continue; }
      let left;
      if (avail >= 2) { draw(lines.slice(0, avail)); y += avail * lh; left = [lines.slice(avail).join(" "), ...b.paras.slice(pi + 1)]; }
      else left = b.paras.slice(pi);
      return { y, rest: [{ label: b.label, paras: left, cont: true }, ...blocks.slice(bi + 1).filter(hasText)] };
    }
    y += 10;
  }
  return { y, rest: [] };
}

function rulesTo(pg, x, y, w, yMax) {
  for (; y + 16 <= yMax; y += 16) pg.line(x, y + 14, x + w, y + 14, pg.T.rule, 0.5);
}

/* ---------- Kopf für Folgeseiten (Fortsetzung, Fotos, Kosten) ---------- */
function miniHeader(pg, kicker, title) {
  pg.label(MX, 40, kicker);
  pg.text(MX, 54, fitT(title, "SB", 20, CW), { f: "SB", s: 20 });
  pg.line(MX, 86, PW - MX, 86, pg.T.rule, 0.8);
  return 106;
}

/* ---------- Deckseite ---------- */
function coverPage(t, st, T, warns) {
  const tpl = TEMPLATES[t.template], pg = new Pg(T);
  const BAND = 290;
  const photo = !!t.coverPhoto;
  if (photo) pg.img(0, 0, PW, BAND, t.coverPhoto, t.coverW, t.coverH);
  else {
    pg.rect(0, 0, PW, BAND, { fill: T.accent });
    pg.icon("pin", PW - MX - 190, 62, 190, mix(T.accent, "#FFFFFF", 0.14), 0.9); /* Dekor */
  }
  const soft = mix(T.accent, "#FFFFFF", 0.78);
  pg.text(MX, 44, "REISEPROTOKOLL  ·  " + tpl.label.toUpperCase(), { f: "B", s: 8, c: soft, ls: 1.8 });
  if (st.range) pg.text(PW - MX, 44, st.range, { f: "B", s: 9, c: T.onAccent, a: "r" });

  /* Titel so groß wie möglich (höchstens zwei Zeilen bei großer, drei bei kleiner Schrift) */
  const ttl = t.title.trim() || "Meine Reise";
  let ts = 32, title = wrapMax(ttl, "SB", 32, CW, 3).lines;
  for (const sz of [58, 50, 44, 38]) {
    const l = wrapAll(ttl, "SB", sz, CW);
    if (l.length <= (sz >= 44 ? 2 : 3)) { ts = sz; title = l; break; }
  }
  const tl = ts * 1.1;
  const sub = t.subtitle.trim() ? wrapMax(t.subtitle, "SI", 16, CW, 2).lines : [];
  const blockH = title.length * tl + (sub.length ? 10 + sub.length * 20 : 0);
  const top = Math.max(96, 266 - blockH);
  pg.rect(MX, top - 18, 44, 3, { fill: T.accent2 });
  title.forEach((l, k) => pg.text(MX, top + k * tl, l, { f: "SB", s: ts, c: T.onAccent }));
  sub.forEach((l, k) => pg.text(MX, top + title.length * tl + 10 + k * 20, l, { f: "SI", s: 16, c: soft }));

  /* Kennzahlen */
  const stats = (tpl.stats ? tpl.stats(t, st) : defaultStats(t, st)).slice(0, 4);
  const gap = 12, cw = (CW - gap * 3) / 4, sy = BAND + 22;
  stats.forEach((c, k) => {
    const x = MX + k * (cw + gap);
    pg.rect(x, sy, cw, 64, { fill: T.soft, r: 8 });
    pg.text(x + 12, sy + 12, fitT(c.v, "SB", 21, cw - 24), { f: "SB", s: 21, c: T.accent });
    pg.text(x + 12, sy + 45, fitT(c.l.toUpperCase(), "B", 6.8, cw - 24, 1), { f: "B", s: 6.8, c: T.muted, ls: 1 });
  });

  /* Karte */
  const my = sy + 64 + 18, mh = 236;
  if (t.mapImg) {
    pg.img(MX, my, CW, mh, t.mapImg, t.mapW, t.mapH);
    pg.rect(MX, my, CW, mh, { stroke: T.rule, sw: 0.8 });
  } else {
    pg.rect(MX, my, CW, mh, { fill: T.soft, r: 8 });
    pg.icon("pin", PW / 2 - 14, my + mh / 2 - 26, 28, T.muted, 1.4);
    pg.text(PW / 2, my + mh / 2 + 10, "Karte noch nicht erzeugt (Reiter „Karte“)", { s: 9, c: T.muted, a: "c" });
    warns.push("Die Karte für die Deckseite fehlt noch (Reiter „Karte“).");
  }
  const pts = t.route.points.map((p) => p.name).filter(Boolean);
  if (pts.length) pg.text(MX, my + mh + 7, fitT(pts.join("  –  "), "R", 8, CW), { s: 8, c: T.muted });

  /* Zusammenfassung */
  const zy = my + mh + 34;
  pg.label(MX, zy, "Zusammenfassung");
  pg.line(MX + 100, zy + 4, PW - MX, zy + 4, T.rule);
  const sum = wrapMax(t.summary.trim() || "–", "S", 11, CW, 6);
  sum.lines.forEach((l, k) => pg.text(MX, zy + 20 + k * 16, l, { f: "S", s: 11 }));
  if (sum.cut) warns.push("Die Zusammenfassung ist für die Deckseite zu lang und wird abgeschnitten (höchstens 6 Zeilen).");
  if (t.travelers.trim()) pg.text(MX, 806, fitT("Reisende: " + t.travelers.trim(), "R", 8.5, CW), { s: 8.5, c: T.muted });
  return pg;
}

function defaultStats(t, st) {
  const cost = st.cost > 0 ? money(st.cost, t.currency) : "–";
  return [
    { v: `${st.nDays} ${st.nDays === 1 ? "Tag" : "Tage"}`, l: st.nDays > 1 ? `Dauer · ${st.nights} Nächte` : "Dauer" },
    { v: String(st.places.length || "–"), l: "Orte" },
    { v: st.km ? (st.kmEst ? "~" : "") + fmtNum(st.km) + " km" : "–", l: "Strecke" },
    { v: cost, l: "Kosten" },
  ];
}

/* ---------- Tagesseite ---------- */
function dayPages(t, i, T, warns) {
  const tpl = TEMPLATES[t.template], d = t.days[i], out = [];
  const pg = new Pg(T); out.push(pg);
  const title = d.title.trim() || "Tag " + (i + 1);

  pg.rect(MX, 40, 56, 56, { fill: T.accent, r: 10 });
  pg.text(MX + 28, 50, "TAG", { f: "B", s: 6.5, c: mix(T.accent, "#FFFFFF", 0.75), a: "c", ls: 1.5 });
  pg.text(MX + 28, 60, String(i + 1), { f: "SB", s: i + 1 > 99 ? 20 : 26, c: T.onAccent, a: "c" });
  const hx = MX + 74, hw = CW - 74;
  pg.text(hx, 42, (fmtLong(d.date) || "Tag " + (i + 1)).toUpperCase(), { f: "B", s: 7.5, c: T.muted, ls: 1.2 });
  pg.text(hx, 56, fitT(title, "SB", 21, hw), { f: "SB", s: 21 });
  const sub = tpl.dayHeader(t, i);
  if (sub) pg.text(hx, 83, fitT(sub, "B", 10, hw), { f: "B", s: 10, c: T.accent });
  pg.line(MX, 110, PW - MX, 110, T.rule, 0.8);

  /* Infokästen */
  const bw = (CW - 20) / 3;
  tpl.info(t, i).slice(0, 3).forEach((b, k) => {
    const x = MX + k * (bw + 10), y = 122;
    pg.rect(x, y, bw, 46, { fill: T.soft, r: 8 });
    pg.label(x + 12, y + 8, b.label, T.muted);
    pg.icon(b.ico, x + 11, y + 21, 17, T.accent, 1.5);
    const v = (b.value || "").trim();
    pg.text(x + 35, y + 25, fitT(v || "–", "R", 9.5, bw - 46), { s: 9.5, c: v ? T.ink : T.muted });
  });

  /* Fotos (die ersten drei als Streifen) */
  const shown = d.photos.slice(0, 3), stripY = BOTTOM - 104;
  const bodyBottom = shown.length ? stripY - 18 : BOTTOM - 4;
  if (shown.length) {
    const g = 8, w = (CW - g * (shown.length - 1)) / shown.length;
    shown.forEach((p, k) => pg.img(MX + k * (w + g), stripY, w, 104, p.src, p.w, p.h));
  }

  /* Text links */
  const lw = 316;
  let bodyTop = 188;
  const sp = tpl.strip ? tpl.strip(t, i) : null;
  if (sp && (sp.from || sp.to)) { routeStrip(pg, sp, T, 182); bodyTop = 236; }
  const blocks = tpl.sections(d);
  let r = flow(pg, blocks, MX, bodyTop, lw, bodyBottom, { T, ruled: t.ruled });
  if (!r.rest.length && t.ruled) rulesTo(pg, MX, r.y, lw, bodyBottom);

  /* Highlights und Ausgaben rechts */
  rightColumn(pg, t, d, T, MX + lw + 24, bodyTop, PW - MX - (MX + lw + 24), bodyBottom, warns, i);

  /* Fortsetzungsseiten */
  for (let n = 0; r.rest.length && n < 8; n++) {
    const p2 = new Pg(T); out.push(p2);
    const y0 = miniHeader(p2, `Tag ${i + 1} · Fortsetzung`, title);
    r = flow(p2, r.rest, MX, y0, CW, BOTTOM, { T, ruled: false });
  }
  if (r.rest.length) warns.push(`Tag ${i + 1}: Der Text ist zu lang und wird abgeschnitten.`);

  /* weitere Fotos: Aufteilung nach Anzahl, gleichmäßig auf Seiten verteilt */
  const more = d.photos.slice(3), per = more.length ? Math.ceil(more.length / Math.ceil(more.length / 6)) : 6;
  for (let k = 0; k < more.length; k += per) {
    const p3 = new Pg(T); out.push(p3);
    const y0 = miniHeader(p3, `Tag ${i + 1} · Fotos`, title), chunk = more.slice(k, k + per);
    galleryCells(chunk.length, MX, y0, CW, BOTTOM - y0).forEach((c, n) => p3.img(c.x, c.y, c.w, c.h, chunk[n].src, chunk[n].w, chunk[n].h));
  }
  return out;
}

/* Rahmen für n Fotos (1–6) in einer Fläche; Höhen begrenzt, damit nichts überlang wird */
function galleryCells(n, x, y, w, h) {
  const g = 12, half = (w - g) / 2, cap = (v) => Math.min(v, 300), out = [];
  const rows = (cols, nr) => { const ch = cap((h - g * (nr - 1)) / nr); return ch; };
  if (n === 1) out.push({ x, y, w, h: Math.min(h, 460) });
  else if (n === 2) { const ch = cap((h - g) / 2); out.push({ x, y, w, h: ch }, { x, y: y + ch + g, w, h: ch }); }
  else if (n === 3) {
    const top = Math.min(300, (h - g) * 0.55), bot = Math.min(220, h - top - g);
    out.push({ x, y, w, h: top }, { x, y: y + top + g, w: half, h: bot }, { x: x + half + g, y: y + top + g, w: half, h: bot });
  } else {
    const nr = Math.ceil(n / 2), ch = rows(2, nr);
    for (let k = 0; k < n; k++) out.push({ x: x + (k % 2) * (half + g), y: y + Math.floor(k / 2) * (ch + g), w: half, h: ch });
  }
  return out;
}

/* Streckenleiste (Rundreise): Start – Ziel mit Kilometern in der Mitte */
function routeStrip(pg, sp, T, y) {
  const ly = y + 30;
  if (sp.from) pg.text(MX, y, fitT(sp.from, "B", 10.5, CW / 2 - 40), { f: "B", s: 10.5 });
  if (sp.to) pg.text(PW - MX, y, fitT(sp.to, "B", 10.5, CW / 2 - 40), { f: "B", s: 10.5, a: "r" });
  pg.line(MX + 8, ly, PW - MX - 8, ly, T.accent2, 1.4);
  pg.rect(MX, ly - 5, 10, 10, { fill: T.paper, stroke: T.accent, sw: 2, r: 5 });
  pg.rect(PW - MX - 10, ly - 5, 10, 10, { fill: T.accent, r: 5 });
  if (sp.mid) {
    const w = tw(sp.mid, "B", 9) + 36;
    pg.rect(PW / 2 - w / 2, ly - 11, w, 22, { fill: T.paper, stroke: T.accent2, sw: 1, r: 11 });
    pg.icon("car", PW / 2 - w / 2 + 9, ly - 8, 15, T.accent, 1.6);
    pg.text(PW / 2 - w / 2 + 28, ly - 4.5, sp.mid, { f: "B", s: 9, c: T.ink });
  }
}

function rightColumn(pg, t, d, T, x, y, w, yMax, warns, i) {
  const hl = dayHighlights(d), costs = d.costs.filter((c) => c.l.trim() || parseNum(c.a));
  const rows = 14, costH = costs.length ? 16 + Math.min(costs.length, 9) * rows + 26 : 0;
  if (hl.length) {
    pg.label(x, y, "Highlights"); y += 16;
    const limit = yMax - costH - (costH ? 14 : 0);
    for (const h of hl) {
      const lines = wrapMax(h, "R", 9.5, w - 13, 3).lines, need = lines.length * 13 + 4;
      if (y + need > limit) { warns.push(`Tag ${i + 1}: Nicht alle Highlights passen auf die Seite.`); break; }
      pg.rect(x, y + 4.5, 4, 4, { fill: T.accent2, r: 2 });
      lines.forEach((l, k) => pg.text(x + 13, y + k * 13 + 1.5, l, { s: 9.5 }));
      y += need;
    }
    y += 12;
  }
  if (costs.length) {
    pg.label(x, y, "Ausgaben"); y += 17;
    const max = 9, list = costs.length > max ? costs.slice(0, max - 1) : costs;
    for (const c of list) {
      const a = money(parseNum(c.a), t.currency), aw = tw(a, "R", 9);
      pg.text(x, y, fitT(c.l || "–", "R", 9, w - aw - 8), { s: 9 });
      pg.text(x + w, y, a, { s: 9, a: "r" });
      y += rows;
    }
    if (costs.length > max) {
      const rest = costs.slice(max - 1);
      pg.text(x, y, `+ ${rest.length} weitere`, { s: 9, c: T.muted });
      pg.text(x + w, y, money(rest.reduce((s, c) => s + parseNum(c.a), 0), t.currency), { s: 9, a: "r", c: T.muted });
      y += rows;
    }
    pg.line(x, y + 2, x + w, y + 2, T.rule, 0.8);
    pg.text(x, y + 8, "Summe", { f: "B", s: 9.5 });
    pg.text(x + w, y + 8, money(dayCosts(d), t.currency), { f: "B", s: 9.5, a: "r", c: T.accent });
  }
}

/* ---------- Kostenübersicht ---------- */
function costPages(t, st, T) {
  if (!(st.cost > 0)) return [];
  const out = [], pg = new Pg(T); out.push(pg);
  miniHeader(pg, "Auswertung", "Kostenübersicht");
  let y = 112;
  pg.text(MX, y, money(st.cost, t.currency), { f: "SB", s: 36, c: T.accent });
  pg.text(MX, y + 46, `insgesamt  ·  ${money(st.perDay, t.currency)} pro Tag  ·  ${st.nDays} ${st.nDays === 1 ? "Tag" : "Tage"}`, { s: 10, c: T.muted });
  y += 84;
  pg.label(MX, y, "Nach Kategorie"); y += 22;
  const cats = CATS.filter((c) => st.byCat[c.id] > 0).sort((a, b) => st.byCat[b.id] - st.byCat[a.id]);
  const bx = MX + 120, bwid = CW - 120 - 112;
  for (const c of cats) {
    const v = st.byCat[c.id], frac = v / st.cost;
    pg.text(MX, y, c.name, { s: 10 });
    pg.rect(bx, y + 1, bwid, 10, { fill: T.soft, r: 5 });
    pg.rect(bx, y + 1, Math.max(4, bwid * frac), 10, { fill: T.accent, r: 5 });
    pg.text(PW - MX, y, money(v, t.currency), { f: "B", s: 10, a: "r" });
    pg.text(PW - MX - 70, y, fmtNum(frac * 100) + " %", { s: 9, c: T.muted, a: "r" });
    y += 24;
  }
  y += 14;
  const rowsAll = t.days.map((d, i) => ({ i, d, sum: dayCosts(d) }));
  let cur = pg, first = true;
  pg.label(MX, y, "Nach Tag"); y += 22;
  for (const r of rowsAll) {
    if (y + 18 > BOTTOM) {
      cur = new Pg(T); out.push(cur);
      y = miniHeader(cur, "Auswertung", "Kostenübersicht · Fortsetzung"); first = false;
    }
    const place = dayPlaceName(t, r.d);
    cur.text(MX, y, `Tag ${r.i + 1}`, { f: "B", s: 9.5 });
    cur.text(MX + 52, y, fitT([fmtDate(r.d.date, { day: "numeric", month: "short" }), place].filter(Boolean).join("  ·  "), "R", 9.5, CW - 52 - 100), { s: 9.5, c: T.muted });
    cur.text(PW - MX, y, r.sum ? money(r.sum, t.currency) : "–", { s: 9.5, a: "r", c: r.sum ? T.ink : T.muted });
    cur.line(MX, y + 15, PW - MX, y + 15, T.rule, 0.5);
    y += 20;
  }
  return out;
}

/* ---------- Gesamtreise ---------- */
function layoutTrip(t) {
  const T = THEMES[t.theme] || THEMES.meer, st = tripStats(t), warns = [], pages = [];
  pages.push(coverPage(t, st, T, warns));
  t.days.forEach((_, i) => pages.push(...dayPages(t, i, T, warns)));
  if (t.costPage) pages.push(...costPages(t, st, T));
  const N = pages.length;
  pages.forEach((pg, n) => {
    if (!n) return;
    pg.line(MX, 800, PW - MX, 800, T.rule, 0.6);
    pg.text(MX, 810, fitT(t.title.trim() || "Meine Reise", "R", 7.5, CW - 80), { s: 7.5, c: T.muted });
    pg.text(PW - MX, 810, `Seite ${n + 1} von ${N}`, { s: 7.5, c: T.muted, a: "r" });
  });
  if (!t.days.length) warns.push("Noch keine Tage angelegt (Reiter „Tage“).");
  return { pages, warns, stats: st };
}

/* ===== 50-render.js ===== */
/* ---------- Vorschau (HTML) und PDF aus dem Seitenmodell ---------- */

const FONT_CSS = {
  R: "font-family:Helvetica,Arial,'Liberation Sans',sans-serif", B: "font-family:Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:700",
  I: "font-family:Helvetica,Arial,'Liberation Sans',sans-serif;font-style:italic", BI: "font-family:Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:700;font-style:italic",
  S: "font-family:'Times New Roman',Times,'Liberation Serif',serif", SB: "font-family:'Times New Roman',Times,'Liberation Serif',serif;font-weight:700",
  SI: "font-family:'Times New Roman',Times,'Liberation Serif',serif;font-style:italic",
};

function pageHtml(pg) {
  const X = (v) => (v / pg.W * 100).toFixed(4) + "%", Y = (v) => (v / pg.H * 100).toFixed(4) + "%";
  const U = (v) => (v / pg.W * 100).toFixed(4) + "cqw";
  const box = (o) => `left:${X(o.x)};top:${Y(o.y)};width:${X(o.w)};height:${Y(o.h)}`;
  let h = "";
  for (const o of pg.ops) {
    if (o.k === "rect") {
      const st = o.stroke ? `border:${U(o.sw)} solid ${o.stroke};box-sizing:border-box;` : "";
      h += `<div class="ab" style="${box(o)};${o.fill ? "background:" + o.fill + ";" : ""}${st}${o.r ? "border-radius:" + U(o.r) : ""}"></div>`;
    } else if (o.k === "line") {
      const horiz = o.y1 === o.y2;
      h += horiz
        ? `<div class="ab" style="left:${X(Math.min(o.x1, o.x2))};top:${Y(o.y1 - o.sw / 2)};width:${X(Math.abs(o.x2 - o.x1))};height:${Y(o.sw)};background:${o.c}"></div>`
        : `<svg class="ab" style="left:0;top:0;width:100%;height:100%" viewBox="0 0 ${pg.W} ${pg.H}" preserveAspectRatio="none"><line x1="${o.x1}" y1="${o.y1}" x2="${o.x2}" y2="${o.y2}" stroke="${o.c}" stroke-width="${o.sw}"/></svg>`;
    } else if (o.k === "t") {
      const w = tw(o.text, o.f, o.s, o.ls), x = o.a === "c" ? o.x - w / 2 : o.a === "r" ? o.x - w : o.x;
      h += `<div class="ab t" style="left:${X(x)};top:${Y(o.y)};font-size:${U(o.s)};color:${o.c};${FONT_CSS[o.f]};${o.ls ? "letter-spacing:" + U(o.ls) + ";" : ""}">${esc(o.text)}</div>`;
    } else if (o.k === "path") {
      h += `<svg class="ab" style="${box(o)}" viewBox="0 0 ${o.vw} ${o.vh}"><path d="${o.d}" fill="${o.fill || "none"}" stroke="${o.stroke || "none"}" stroke-width="${o.sw}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    } else if (o.k === "img") {
      h += `<img class="ab im" style="${box(o)}" src="${o.src}" alt="">`;
    }
  }
  return h;
}

/* ---------- PDF ---------- */
function bytesOfDataUrl(u) {
  const b = atob(u.slice(u.indexOf(",") + 1)), a = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
  return a;
}

async function buildPdf(pages, meta, onProgress) {
  const L = PDFLib, doc = await L.PDFDocument.create();
  doc.setTitle(meta.title || "Reiseprotokoll"); doc.setCreator("Reise-Protokoll"); doc.setProducer("Reise-Protokoll (pdf-lib)");
  if (meta.author) doc.setAuthor(meta.author);
  const fonts = {};
  for (const k in FONT_NAMES) fonts[k] = await doc.embedFont(L.StandardFonts[FONT_NAMES[k]]);
  const rgbOf = (hex) => { const [r, g, b] = hexRgb(hex); return L.rgb(r / 255, g / 255, b / 255); };
  const imgs = new Map();
  const embed = async (src) => {
    if (!imgs.has(src)) imgs.set(src, /^data:image\/png/.test(src) ? await doc.embedPng(bytesOfDataUrl(src)) : await doc.embedJpg(bytesOfDataUrl(src)));
    return imgs.get(src);
  };
  const rrPath = (w, h, r) => `M${r} 0H${w - r}A${r} ${r} 0 0 1 ${w} ${r}V${h - r}A${r} ${r} 0 0 1 ${w - r} ${h}H${r}A${r} ${r} 0 0 1 0 ${h - r}V${r}A${r} ${r} 0 0 1 ${r} 0Z`;

  for (let n = 0; n < pages.length; n++) {
    const pg = pages[n], page = doc.addPage([pg.W, pg.H]), Y = (y) => pg.H - y;
    for (const o of pg.ops) {
      if (o.k === "rect") {
        const opt = {};
        if (o.fill) opt.color = rgbOf(o.fill);
        if (o.stroke) { opt.borderColor = rgbOf(o.stroke); opt.borderWidth = o.sw; }
        if (o.r > 0) page.drawSvgPath(rrPath(o.w, o.h, o.r), { x: o.x, y: Y(o.y), ...opt });
        else page.drawRectangle({ x: o.x, y: Y(o.y + o.h), width: o.w, height: o.h, ...opt });
      } else if (o.k === "line") {
        page.drawLine({ start: { x: o.x1, y: Y(o.y1) }, end: { x: o.x2, y: Y(o.y2) }, thickness: o.sw, color: rgbOf(o.c) });
      } else if (o.k === "t") {
        const font = fonts[o.f], base = o.y + (isSerif(o.f) ? BASELINE.serif : BASELINE.sans) * o.s;
        const w = tw(o.text, o.f, o.s, o.ls);
        let x = o.a === "c" ? o.x - w / 2 : o.a === "r" ? o.x - w : o.x;
        if (!o.ls) page.drawText(o.text, { x, y: Y(base), size: o.s, font, color: rgbOf(o.c) });
        else for (const ch of o.text) {
          page.drawText(ch, { x, y: Y(base), size: o.s, font, color: rgbOf(o.c) });
          x += font.widthOfTextAtSize(ch, o.s) + o.ls;
        }
      } else if (o.k === "path") {
        const opt = { x: o.x, y: Y(o.y), scale: o.w / o.vw, borderLineCap: L.LineCapStyle.Round };
        if (o.fill) opt.color = rgbOf(o.fill);
        if (o.stroke) { opt.borderColor = rgbOf(o.stroke); opt.borderWidth = o.sw; }
        page.drawSvgPath(o.d, opt);
      } else if (o.k === "img") {
        const im = await embed(o.src), s = Math.max(o.w / im.width, o.h / im.height);
        const dw = im.width * s, dh = im.height * s;
        page.pushOperators(L.pushGraphicsState(), L.moveTo(o.x, Y(o.y + o.h)), L.lineTo(o.x + o.w, Y(o.y + o.h)),
          L.lineTo(o.x + o.w, Y(o.y)), L.lineTo(o.x, Y(o.y)), L.closePath(), L.clip(), L.endPath());
        page.drawImage(im, { x: o.x + (o.w - dw) / 2, y: Y(o.y + o.h) + (o.h - dh) / 2, width: dw, height: dh });
        page.pushOperators(L.popGraphicsState());
      }
    }
    if (onProgress) onProgress(n + 1, pages.length);
  }
  return doc.save({ useObjectStreams: true });
}

/* ===== 60-map.js ===== */
/* ---------- Karte der Fahrstrecke ----------
   Die Karte wird einmal aus OpenStreetMap-Kacheln zusammengesetzt, mit der Route
   übermalt und als JPEG in der Reise gespeichert. Danach ist sie statisch.
   Gehen die Kacheln nicht (offline, gesperrt), entsteht eine Schemakarte. */
const MAP_W = 1236, MAP_H = 566, TILE = 256;
const mapProj = (lat, lon, z) => {
  const n = TILE * 2 ** z, s = Math.sin(lat * Math.PI / 180);
  return { x: (lon + 180) / 360 * n, y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n };
};

function mapSignature(t) {
  return JSON.stringify([t.route.points.filter(hasGeo).map((p) => [p.name, +p.lat.toFixed(3), +p.lon.toFixed(3)]), !!t.route.road, t.theme]);
}

/* Straßenroute über OSRM (öffentlicher Demo-Server, nur für wenige Anfragen gedacht). */
async function osrmRoute(pts) {
  const q = pts.map((p) => p.lon.toFixed(5) + "," + p.lat.toFixed(5)).join(";");
  const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${q}?overview=full&geometries=geojson`, { signal: AbortSignal.timeout(15000) });
  if (!r.ok) throw new Error("OSRM " + r.status);
  const j = await r.json();
  if (!j.routes || !j.routes[0]) throw new Error("keine Route");
  const rt = j.routes[0];
  return {
    geom: rt.geometry.coordinates.map(([lon, lat]) => ({ lat, lon })),
    km: rt.distance / 1000,
    legs: rt.legs.map((l) => ({ km: l.distance / 1000, min: l.duration / 60 })),
  };
}

function loadTile(z, x, y) {
  return new Promise((res) => {
    const im = new Image();
    im.crossOrigin = "anonymous";
    const to = setTimeout(() => res(null), 9000);
    im.onload = () => { clearTimeout(to); res(im); };
    im.onerror = () => { clearTimeout(to); res(null); };
    im.src = `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
  });
}

/* Liefert {src, w, h, mode: "osm"|"schema", legs?, km?} */
async function renderMap(t, { road = true, onStatus = () => {}, noTiles = false, pre = null } = {}) {
  const T = THEMES[t.theme] || THEMES.meer;
  const pts = t.route.points.filter(hasGeo);
  if (!pts.length) throw new Error("Keine Orte mit Koordinaten. Bitte Orte über die Suche wählen.");

  let geom = pts, info = pre || {};
  if (pre && pre.geom) geom = pre.geom;
  else if (road && pts.length > 1) {
    try { onStatus("Straßenroute wird berechnet …"); info = await osrmRoute(pts); geom = info.geom; }
    catch (e) { console.warn(e); onStatus("Straßenroute nicht verfügbar, es werden Luftlinien gezeichnet …"); }
  }

  /* Ausschnitt */
  const lats = geom.map((p) => p.lat), lons = geom.map((p) => p.lon);
  const pad = 70, bb = { a: Math.min(...lats), b: Math.max(...lats), c: Math.min(...lons), d: Math.max(...lons) };
  let z = 12;
  if (pts.length > 1 || geom.length > 1) {
    for (z = 15; z > 2; z--) {
      const p1 = mapProj(bb.b, bb.c, z), p2 = mapProj(bb.a, bb.d, z);
      if (p2.x - p1.x <= MAP_W - 2 * pad && p2.y - p1.y <= MAP_H - 2 * pad) break;
    }
  }
  const c1 = mapProj(bb.b, bb.c, z), c2 = mapProj(bb.a, bb.d, z);
  const ox = (c1.x + c2.x) / 2 - MAP_W / 2, oy = (c1.y + c2.y) / 2 - MAP_H / 2;
  const to = (p) => { const q = mapProj(p.lat, p.lon, z); return { x: q.x - ox, y: q.y - oy }; };

  const cv = document.createElement("canvas"); cv.width = MAP_W; cv.height = MAP_H;
  const g = cv.getContext("2d");
  g.fillStyle = mix(T.soft, "#FFFFFF", 0.4); g.fillRect(0, 0, MAP_W, MAP_H);

  /* Kacheln */
  if (!noTiles) onStatus("Kartenkacheln werden geladen …");
  const tx0 = Math.floor(ox / TILE), tx1 = Math.floor((ox + MAP_W) / TILE), ty0 = Math.floor(oy / TILE), ty1 = Math.floor((oy + MAP_H) / TILE);
  const jobs = [], nT = 2 ** z;
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    if (ty < 0 || ty >= nT) continue;
    const wx = ((tx % nT) + nT) % nT;
    if (noTiles) continue;
    jobs.push(loadTile(z, wx, ty).then((im) => ({ im, tx, ty })));
  }
  const tiles = await Promise.all(jobs);
  const ok = tiles.filter((x) => x.im);
  let mode = ok.length >= Math.max(1, tiles.length * 0.7) ? "osm" : "schema";
  if (mode === "osm") for (const { im, tx, ty } of ok) g.drawImage(im, tx * TILE - ox, ty * TILE - oy);
  else drawSchemaGrid(g, T);

  /* Route */
  const path = (arr) => { g.beginPath(); arr.forEach((p, i) => { const q = to(p); i ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y); }); };
  g.lineJoin = "round"; g.lineCap = "round";
  if (geom.length > 1) {
    path(geom); g.strokeStyle = "rgba(255,255,255,.95)"; g.lineWidth = 13; g.stroke();
    path(geom); g.strokeStyle = T.accent; g.lineWidth = 7; g.stroke();
  }

  /* Marker mit Nummer und Name; doppelte Orte (Rückkehr zum Start) nur einmal */
  const marks = [];
  pts.forEach((p, i) => {
    const prev = marks.find((m) => haversine(m.p, p) < 1);
    if (prev) { prev.nums.push(i + 1); return; }
    marks.push({ p, nums: [i + 1], name: p.name });
  });
  g.textBaseline = "middle";
  const placed = [];
  for (const m of marks) {
    const q = to(m.p);
    g.beginPath(); g.arc(q.x, q.y, 19, 0, 7); g.fillStyle = "#fff"; g.fill();
    g.beginPath(); g.arc(q.x, q.y, 15, 0, 7); g.fillStyle = T.accent2; g.fill();
    g.fillStyle = T.ink; g.font = "700 17px Helvetica, Arial, sans-serif"; g.textAlign = "center";
    g.fillText(m.nums.length > 1 ? m.nums[0] + "/" + m.nums[m.nums.length - 1] : String(m.nums[0]), q.x, q.y + 1, 28);
    /* Beschriftung rechts, sonst links; bei Überlappung darunter */
    g.font = "700 21px Helvetica, Arial, sans-serif";
    const w = g.measureText(m.name).width;
    const cands = [[q.x + 26, q.y, "left"], [q.x - 26, q.y, "right"], [q.x, q.y + 38, "center"], [q.x, q.y - 38, "center"]];
    let pick = cands[0];
    for (const c of cands) {
      const x0 = c[2] === "left" ? c[0] : c[2] === "right" ? c[0] - w : c[0] - w / 2;
      const r = { x0, x1: x0 + w, y0: c[1] - 13, y1: c[1] + 13 };
      if (r.x0 < 8 || r.x1 > MAP_W - 8 || r.y0 < 8 || r.y1 > MAP_H - 8) continue;
      if (placed.some((o) => r.x0 < o.x1 && r.x1 > o.x0 && r.y0 < o.y1 && r.y1 > o.y0)) continue;
      pick = c; placed.push(r); break;
    }
    g.textAlign = pick[2]; g.lineWidth = 6; g.strokeStyle = "rgba(255,255,255,.95)"; g.strokeText(m.name, pick[0], pick[1]);
    g.fillStyle = T.ink; g.fillText(m.name, pick[0], pick[1]);
  }

  /* Quellenangabe */
  const credit = mode === "osm" ? "© OpenStreetMap-Mitwirkende" : "Schemakarte (ohne Kartenhintergrund)";
  g.font = "15px Helvetica, Arial, sans-serif"; g.textAlign = "right"; g.textBaseline = "alphabetic";
  const cw = g.measureText(credit).width + 14;
  g.fillStyle = "rgba(255,255,255,.85)"; g.fillRect(MAP_W - cw, MAP_H - 24, cw, 24);
  g.fillStyle = "#333"; g.fillText(credit, MAP_W - 7, MAP_H - 7);

  let src;
  try { src = cv.toDataURL("image/jpeg", 0.88); }
  catch (e) { /* Canvas durch fremde Kacheln gesperrt: Schemakarte */ return renderMap(t, { noTiles: true, pre: { ...info, geom } }); }
  return { src, w: MAP_W, h: MAP_H, mode, km: info.km, legs: info.legs };
}

function drawSchemaGrid(g, T) {
  g.strokeStyle = mix(T.rule, "#FFFFFF", 0.3); g.lineWidth = 2;
  for (let x = 0; x < MAP_W; x += 103) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, MAP_H); g.stroke(); }
  for (let y = 0; y < MAP_H; y += 103) { g.beginPath(); g.moveTo(0, y); g.lineTo(MAP_W, y); g.stroke(); }
}

/* ===== 70-photos.js ===== */
/* ---------- Fotos und Orte ----------
   Fotos werden auf 1600 px verkleinert und als JPEG in der Reise gespeichert.
   Aus EXIF kommen Aufnahmetag und GPS-Position. */
const PHOTO_EDGE = 1600;

function exifDay(raw) {
  const m = /^(\d{4}):(\d{2}):(\d{2})/.exec(String(raw || ""));
  return m ? `${m[1]}-${m[2]}-${m[3]}` : "";
}

async function readPhoto(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const s = Math.min(1, PHOTO_EDGE / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  bmp.close && bmp.close();
  let gps = null, day = "";
  if (window.exifr) {
    try { const g = await exifr.gps(file); if (g && Number.isFinite(g.latitude)) gps = { lat: g.latitude, lon: g.longitude }; } catch (e) { /* kein GPS */ }
    try {
      const x = await exifr.parse(file, { pick: ["DateTimeOriginal", "CreateDate"], reviveValues: false });
      day = exifDay(x && (x.DateTimeOriginal || x.CreateDate));
    } catch (e) { /* kein Datum */ }
  }
  if (!day && file.lastModified) day = isoOf(new Date(file.lastModified));
  return { id: uid(), name: file.name, src: cv.toDataURL("image/jpeg", 0.85), w: cv.width, h: cv.height, gps, day };
}

/* ---------- Nominatim (OpenStreetMap): Suche und Ortsname, höchstens eine Anfrage pro Sekunde ---------- */
let nomChain = Promise.resolve();
function nominatim(path) {
  const run = () => fetch("https://nominatim.openstreetmap.org/" + path, { headers: { Accept: "application/json" }, signal: AbortSignal.timeout(12000) })
    .then((r) => { if (!r.ok) throw new Error("Nominatim " + r.status); return r.json(); });
  const p = nomChain.then(run, run);
  nomChain = p.then(() => new Promise((r) => setTimeout(r, 1100)), () => new Promise((r) => setTimeout(r, 1100)));
  return p;
}
const placeNameOf = (r) => {
  const a = r.address || {};
  return a.city || a.town || a.village || a.municipality || a.hamlet || a.county || r.name || String(r.display_name || "").split(",")[0];
};
async function searchPlace(q) {
  const r = await nominatim(`search?format=jsonv2&addressdetails=1&limit=6&accept-language=de&q=${encodeURIComponent(q)}`);
  return r.map((x) => ({ name: placeNameOf(x) || q, lat: +x.lat, lon: +x.lon, info: x.display_name }));
}
async function reversePlace(lat, lon) {
  const r = await nominatim(`reverse?format=jsonv2&zoom=10&addressdetails=1&accept-language=de&lat=${lat}&lon=${lon}`);
  return placeNameOf(r) || "";
}

/* ---------- Zugriff auf Felder über Schlüssel ----------
   "title", "startPlace.name", "d:<tagId>.place.name", "d:<tagId>.costs.<id>.l", "route.points.<id>.name" */
function getRef(key) {
  const parts = key.split(".");
  let obj = S.trip;
  if (parts[0].startsWith("d:")) { obj = S.trip.days.find((d) => d.id === parts[0].slice(2)); parts.shift(); }
  else if (parts[0] === "$new") { obj = S.newPoint; parts.shift(); }
  for (let i = 0; i < parts.length - 1 && obj; i++) obj = Array.isArray(obj) ? obj.find((x) => x.id === parts[i]) : obj[parts[i]];
  return obj ? { obj, prop: parts[parts.length - 1] } : null;
}
