<style>
/*__STYLES__*/
</style>

<div id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6.5-5.7 6.5-11a6.5 6.5 0 1 0-13 0C5.5 15.3 12 21 12 21z"/><circle cx="12" cy="10" r="2.4"/></svg> Reise-Protokoll <span class="ver">__VERSION__</span></div>
    <div class="grow"></div>
    <select id="demo" title="Beispielreise laden">
      <option value="">Beispiel laden …</option>
      <option value="rundreise">Beispiel Rundreise</option>
      <option value="kurztrip">Beispiel Kurztrip</option>
    </select>
    <button data-act="new">Neu</button>
    <button data-act="open">Öffnen</button>
    <button data-act="save">Speichern</button>
    <button class="primary" data-act="pdf" id="pdfBtn">PDF erstellen</button>
    <input type="file" id="openFile" accept=".json,application/json" hidden>
  </header>
  <main>
    <aside id="side">
      <nav class="tabs" id="tabs">
        <button data-tab="trip">Reise</button>
        <button data-tab="days">Tage</button>
        <button data-tab="map">Karte</button>
        <button data-tab="sum">Zusammenfassung</button>
      </nav>
      <div id="panel"></div>
    </aside>
    <section id="view">
      <div class="viewbar">
        <span id="pageCount"></span>
        <span id="warn"></span>
        <div class="grow"></div>
        <label>Zoom <select id="zoom"><option value="55">55 %</option><option value="75">75 %</option><option value="100" selected>100 %</option><option value="130">130 %</option></select></label>
      </div>
      <div id="pages"></div>
    </section>
  </main>
</div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
